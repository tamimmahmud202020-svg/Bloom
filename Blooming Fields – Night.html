<title>Blooming Fields</title>
<style>
:root{--bg:#050706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050706}}
:root[data-theme="dark"]{--bg:#050706}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{position:fixed;inset:0;display:grid;place-items:center;z-index:3;cursor:pointer;background:rgba(0,0,0,.28);transition:opacity 1s}
#pl{width:84px;height:84px;border-radius:50%;border:1.5px solid rgba(255,255,255,.95);display:grid;place-items:center;backdrop-filter:blur(8px);background:rgba(255,255,255,.12);animation:pu 2.4s infinite}
#pl svg{width:30px;height:30px;margin-left:5px;fill:#fff}
@keyframes pu{50%{box-shadow:0 0 0 18px rgba(255,255,255,.1)}}
#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity 1s}
#mu svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
